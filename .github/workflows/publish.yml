name: Publish blog

# Every change merged into main (an approved post, a design tweak) rebuilds and publishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 6 * * *'   # daily rebuild, so posts given a future publish date go live on their day

permissions:
  contents: write   # to commit the record of social posts back to main
  pages: write
  id-token: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check every post
        run: node scripts/check-post.mjs --all

      # Remember what's live now, so only new or changed posts get announced after publishing.
      - name: Save the live article list
        run: curl -fsSL https://blog.mobilepitstop.uk/articles.json -o "$RUNNER_TEMP/live-articles.json" || echo '[]' > "$RUNNER_TEMP/live-articles.json"

      - name: Build the blog
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Tell Bing and other IndexNow search engines about new posts straight away.
      # Google finds them through the sitemap. This step can never fail the publish.
      - name: Announce new posts (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs --previous "$RUNNER_TEMP/live-articles.json"

      # Post approved posts to Facebook, Instagram and Google Business Profile (through Make), then
      # record what went out in post.json so nothing is posted twice. A failed platform stays
      # "approved" and is retried on the next run (every push, and the daily rebuild).
      # This step can never fail the publish.
      - name: Post approved social posts
        id: social
        continue-on-error: true
        env:
          MPS_SOCIAL_HOOK: ${{ secrets.MPS_SOCIAL_HOOK }}
          MPS_SOCIAL_TOKEN: ${{ secrets.MPS_SOCIAL_TOKEN }}
        run: node scripts/share.mjs --approved

      - name: Record social posts
        if: always()
        run: |
          if git diff --quiet -- content/posts; then echo "Nothing to record."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Record social posts [skip ci]"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
